<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Every answer starts with a trail</title>
  <desc id="desc">Grok, OpenAI, Claude, Gemini and custom agents send a claim to Facet. Live routes use Serper for search, Exa for semantic discovery and documents, TikHub for X, ScrapeCreators for Reddit, and SerpApi for fallback search. Evidence returns for a sourced assessment. Nine additional provider options are shown separately and are not active integrations.</desc>
  <style>text{font-family:system-ui,-apple-system,sans-serif;fill:#282338}.name{font-size:15px;font-weight:600}.detail{font-size:12px;fill:#726b80}.wire{fill:none;stroke:#c5bbdc;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#7051db}.evidence{fill:#9abd42}@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
  <rect x="1" y="1" width="1198" height="748" rx="12" fill="#f6f3fc" stroke="#e5deef"/>
  <g class="wire">
    <path id="grok" d="M370 68H576Q600 68 600 92V104"/><path id="openai" d="M485 68H576Q600 68 600 92V104"/><path id="claude" d="M600 68V104"/><path id="gemini" d="M715 68H624Q600 68 600 92V104"/><path id="custom" d="M830 68H624Q600 68 600 92V104"/>
    <path id="serper" d="M600 174V185Q600 199 586 199H152Q138 199 138 213V236"/><path id="exa" d="M600 174V185Q600 199 586 199H382Q368 199 368 213V236"/><path id="tikhub" d="M600 174V236"/><path id="reddit" d="M600 174V185Q600 199 614 199H818Q832 199 832 213V236"/><path id="bing" d="M600 174V185Q600 199 614 199H1048Q1062 199 1062 213V236"/>
    <path id="source1" d="M138 320V341Q138 355 152 355H586Q600 355 600 369V389"/><path id="source2" d="M368 320V341Q368 355 382 355H586Q600 355 600 369V389"/><path id="source3" d="M600 320V389"/><path id="source4" d="M832 320V341Q832 355 818 355H614Q600 355 600 369V389"/><path id="source5" d="M1062 320V341Q1062 355 1048 355H614Q600 355 600 369V389"/>
  </g>
  <g class="motion">
    <circle class="dot" r="4"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#grok"/></animateMotion></circle><circle class="dot" r="4"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#openai"/></animateMotion></circle><circle class="dot" r="4"><animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#claude"/></animateMotion></circle><circle class="dot" r="4"><animateMotion dur="5.3s" repeatCount="indefinite"><mpath href="#gemini"/></animateMotion></circle><circle class="dot" r="4"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#custom"/></animateMotion></circle>
    <circle class="dot" r="4"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#serper"/></animateMotion></circle><circle class="dot" r="4"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#exa"/></animateMotion></circle><circle class="dot" r="4"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#tikhub"/></animateMotion></circle><circle class="dot" r="4"><animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#reddit"/></animateMotion></circle><circle class="dot" r="4"><animateMotion dur="6.5s" repeatCount="indefinite"><mpath href="#bing"/></animateMotion></circle>
    <circle class="evidence" r="4"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#source1"/></animateMotion></circle><circle class="evidence" r="4"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#source2"/></animateMotion></circle><circle class="evidence" r="4"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#source3"/></animateMotion></circle><circle class="evidence" r="4"><animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#source4"/></animateMotion></circle><circle class="evidence" r="4"><animateMotion dur="6.5s" repeatCount="indefinite"><mpath href="#source5"/></animateMotion></circle>
