name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:audit
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm test
      - run: npm run build
      - run: npm run deploy:check
